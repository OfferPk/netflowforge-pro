<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchNetflow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchNetflow)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Flow Telemetry Architecture: Stale NetFlow vs Zero-Trust IPFIX Pipeline
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hazardous: Stale Timeouts &amp; Blind Spots
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">1800s Active Timeout &bull; 0s Template Refresh</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Missing TCP Flags &bull; Single Collector &bull; No TCAM Rate Limit</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CRITICAL TELEMETRY RISKS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 30-minute active timeout conceals ongoing volumetric DDoS elephant flows</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Omission of template refresh causes "Unknown Template ID" collector drops</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Missing TCP flags blinds SIEM/SOC to SYN floods, FIN scans &amp; sweeps</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Spoofed-IP attacks overflow switch TCAM flow table, locking out management</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">DECODER DESYNC &bull; TCAM EXHAUSTION &bull; TELEMETRY BLINDNESS</text>

  <!-- Right: Hardened Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#1c1205" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: NetFlowForge Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#1e293b"/>
  <text x="560" y="170" fill="#fbbf24" font-family="monospace" font-size="11">60s Template Sync &bull; 30s Active &bull; 15s Inactive</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">TCP Flags &bull; Dual Collectors &bull; Hardware TCAM Policer</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#2d1c05" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE SOC GUARANTEES:</text>
  <text x="560" y="275" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="11">&bull; 60s template refresh guarantees uninterrupted collector decoding</text>
  <text x="560" y="305" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="11">&bull; 30s active timeout detects live DDoS volumetric attacks in near real-time</text>
  <text x="560" y="335" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="11">&bull; Full L4 TCP control flags captured for automated SYN-flood forensic triage</text>
  <text x="560" y="365" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="11">&bull; Hardware TCAM table rate-limiting prevents switch memory crash</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 7011 &bull; RFC 3954 &bull; CISCO FNF, JUNIPER, ARISTA &amp; OVS</text>
</svg>
