<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDarkNetflow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="accentGradNetflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkNetflow)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="46" y="38" width="155" height="32" rx="8" fill="url(#accentGradNetflow)"/>
  <text x="123" y="59" fill="#030712" font-family="-apple-system, sans-serif" font-weight="900" font-size="11" text-anchor="middle">IPFIX &bull; NETFLOW</text>
  
  <text x="215" y="55" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">NetFlowForge Pro</text>
  <text x="445" y="55" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="500" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| Zero-Trust Flow Telemetry &amp; DDoS Studio</text>

  <rect x="850" y="40" width="150" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="925" y="58" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 7011 / RFC 3954</text>

  <rect x="1015" y="40" width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1087" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">SCORE: 100/100 (A+)</text>

  <!-- Left Column: Parameters & Fabric Settings -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. Flow Exporter &amp; Protocol Architecture</text>

  <rect x="50" y="145" width="245" height="48" rx="6" fill="#02040a" stroke="#1e293b"/>
  <text x="60" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">EXPORT PROTOCOL &amp; DOMAIN</text>
  <text x="60" y="182" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">IPFIX (RFC 7011 / Domain 1)</text>

  <rect x="315" y="145" width="250" height="48" rx="6" fill="#02040a" stroke="#1e293b"/>
  <text x="325" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">TEMPLATE ID &amp; REFRESH</text>
  <text x="325" y="182" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">ID: 256 | Refresh: 60s (1000 pkts)</text>

  <!-- Probe Preview and Sizing -->
  <rect x="50" y="205" width="515" height="45" rx="6" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="65" y="225" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">⚡ Active: 30s &bull; Inactive: 15s &bull; Sampling: 1:1 (Unsampled)</text>
  <text x="65" y="241" fill="#94a3b8" font-family="monospace" font-size="10">TCAM Rate Limit: Active &bull; Direction: In/Out &bull; Dual Collectors: 2 Targets</text>

