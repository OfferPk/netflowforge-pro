  <text x="50" y="275" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">2. Zero-Trust Telemetry Safeguards</text>
  
  <rect x="50" y="290" width="245" height="45" rx="6" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="65" y="310" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🔒 60s Template Refresh</text>
  <text x="65" y="326" fill="#94a3b8" font-family="monospace" font-size="10">Prevents collector decode loss</text>

  <rect x="315" y="290" width="250" height="45" rx="6" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="330" y="310" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">📦 30s Active Timeout</text>
  <text x="330" y="326" fill="#94a3b8" font-family="monospace" font-size="10">Detects live DDoS elephant flows</text>

  <rect x="50" y="345" width="245" height="45" rx="6" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="65" y="365" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🌐 TCP Control Flags</text>
  <text x="65" y="381" fill="#94a3b8" font-family="monospace" font-size="10">SYN-flood &amp; scan detection</text>

  <rect x="315" y="345" width="250" height="45" rx="6" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="330" y="365" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">⚡ TCAM Flood Policer</text>
  <text x="330" y="381" fill="#94a3b8" font-family="monospace" font-size="10">Blocks hardware flow exhaustion</text>

  <!-- Technical Summary Card -->
  <rect x="50" y="410" width="515" height="215" rx="8" fill="#02040a" stroke="#1e293b"/>
  <text x="65" y="435" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">FLOW TELEMETRY SPECIFICATION:</text>
  <text x="65" y="460" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; Standard RFC 7011 IPFIX / RFC 3954 NetFlow v9 binary protocol</text>
  <text x="65" y="485" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; Granular L4 security fields: TCP flags, ports, protocols, ToS/DSCP</text>
  <text x="65" y="510" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; TCAM sizing engine models active concurrent flow table pressure</text>
  <text x="65" y="535" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; 10-Point Zero-Trust rubric audits timeouts, sampling &amp; collector redundancy</text>
  <text x="65" y="575" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">✅ Production Verified: Cisco IOS-XE, NX-OS, Juniper Junos, Arista &amp; Linux</text>

  <!-- Right Column: Scorecard & Wireframe / Synthesizer -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="65" rx="10" fill="#071b16" stroke="#10b981" stroke-width="1.2"/>
  <rect x="650" y="128" width="48" height="48" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="674" y="160" fill="#34d399" font-family="monospace" font-weight="800" font-size="22" text-anchor="middle">A+</text>
  <text x="715" y="145" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Zero-Trust Telemetry Score: 100 / 100</text>
  <text x="715" y="165" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Optimal 60s Refresh • 30s Active Timeout • Dual Collectors • TCP Flags</text>

  <!-- Binary IPFIX Hex Dump -->
  <text x="635" y="210" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">RFC 7011 IPFIX Binary Packet &amp; Hex Dump</text>
  <rect x="635" y="220" width="515" height="120" rx="8" fill="#02040a" stroke="#1e293b"/>
  <text x="650" y="242" fill="#64748b" font-family="monospace" font-size="10">// IPFIX Header (16B) + Template Set (44B) + Data Set (44B) shown:</text>
  <text x="650" y="262" fill="#fbbf24" font-family="monospace" font-size="10">0000:  00 0a 00 68 67 01 02 a4  00 00 00 65 00 00 00 01  |...hg......e....|</text>
  <text x="650" y="282" fill="#f59e0b" font-family="monospace" font-size="10">0010:  00 02 00 2c 01 00 00 0a  00 08 00 04 00 0c 00 04  |...,............|</text>
  <text x="650" y="302" fill="#34d399" font-family="monospace" font-size="10">// Version: 10 (IPFIX) | Template ID: 256 | Elements: 10 | Octets: 184520</text>

  <!-- Synthesizer Output -->
  <text x="635" y="365" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multi-Vendor Synthesizer (Active: Cisco IOS-XE FNF)</text>
  <rect x="635" y="375" width="515" height="250" rx="8" fill="#02040a" stroke="#1e293b"/>
  <text x="650" y="400" fill="#64748b" font-family="monospace" font-size="10">! Cisco IOS-XE Flexible NetFlow (FNF) / IPFIX</text>
  <text x="650" y="420" fill="#f59e0b" font-family="monospace" font-size="10">flow record FNF_SECURITY_REC</text>
  <text x="650" y="440" fill="#38bdf8" font-family="monospace" font-size="10"> match ipv4 source address</text>
  <text x="650" y="460" fill="#38bdf8" font-family="monospace" font-size="10"> collect transport tcp flags</text>
  <text x="650" y="480" fill="#f59e0b" font-family="monospace" font-size="10">flow exporter FNF_PRIMARY_EXP</text>
  <text x="650" y="500" fill="#38bdf8" font-family="monospace" font-size="10"> template data timeout 60</text>
  <text x="650" y="525" fill="#f59e0b" font-family="monospace" font-size="10">flow monitor FNF_EDGE_MON</text>
  <text x="650" y="550" fill="#34d399" font-family="monospace" font-size="10"> cache timeout active 30</text>
  <text x="650" y="585" fill="#94a3b8" font-family="monospace" font-size="10">! Also synthesizes: Cisco NX-OS, Juniper Junos, Arista EOS, Linux OVS</text>
  <text x="650" y="610" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">✅ 1-Click Multi-Vendor Flow Telemetry Deployment</text>
</svg>
